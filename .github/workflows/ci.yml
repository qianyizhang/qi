name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv run --no-project python scripts/check_game_package.py

  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make install
      - run: make check
        env:
          UV_OFFLINE: "true"

  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra data --extra learning
      - run: make test-data
        env:
          UV_OFFLINE: "true"

  learning-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_CACHE_DIR: .cache/uv
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra learning
      - run: make test-learning
        env:
          UV_OFFLINE: "true"
      - run: uv run --locked python scripts/check_reference_package.py --output artifacts/reference-package
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reference-diagnostics
          path: artifacts/reference-package
          retention-days: 7
